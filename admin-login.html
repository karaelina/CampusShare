<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | CampusShare</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f4f2;color:#171717;font-family:Arial,sans-serif;padding:24px}.card{width:min(100%,420px);background:#fff;border:1px solid #e2e2df;border-radius:18px;padding:34px;box-shadow:0 18px 55px #0000000a}.brand{display:flex;align-items:center;gap:11px;font-weight:700;margin-bottom:30px}.mark{display:grid;place-items:center;width:42px;height:42px;background:#111;color:#fff;border-radius:12px;font-family:Georgia,serif}.eyebrow{font-size:11px;letter-spacing:2px;color:#777}h1{font-family:Georgia,serif;font-size:32px;font-weight:500;margin:10px 0}p{color:#666;line-height:1.5;font-size:14px}label{display:block;font-size:13px;font-weight:700;margin:18px 0 7px}input{width:100%;padding:13px;border:1px solid #d8d8d4;border-radius:9px;font:inherit}button{width:100%;margin-top:22px;padding:14px;background:#111;color:#fff;border:0;border-radius:9px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{display:none;background:#fff0ef;color:#8d1f18;padding:11px;border-radius:8px;font-size:13px;margin-top:15px}.foot{margin-top:22px;text-align:center;font-size:12px;color:#777}
</style></head><body><main class="card"><div class="brand"><span class="mark">CS</span><span>CampusShare</span></div><div class="eyebrow">RESTRICTED ACCESS</div><h1>Admin sign in</h1><p>This portal is for authorized CampusShare administrators. Student and provider accounts cannot access admin functions.</p><form id="login"><label for="username">Admin username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><div id="error" class="error" role="alert"></div><button id="submit" type="submit">Sign in securely</button></form><div class="foot">CampusShare Administration · Authorized access only</div></main><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),box=document.getElementById('error');btn.disabled=true;box.style.display='none';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to sign in.');location.href=data.redirect||'/admin';}catch(err){box.textContent=err.message;box.style.display='block';}finally{btn.disabled=false;}});
</script></body></html>
