<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Notifications — CampusShare</title>

  <link
    rel="stylesheet"
    href="css/notifications.css"
  >

</head>


<body>

  <!-- =========================
       SIDEBAR
  ========================== -->

  <aside class="sidebar">

    <div class="brand">

      <span class="brand-mark">
        CS
      </span>

      <span>
        CampusShare
      </span>

    </div>


    <div class="student-card">

      <div class="avatar">
        J
      </div>

      <div>

        <strong>
          Juan dela Cruz
        </strong>

        <small>
          2024-00123 · PSAU
        </small>

      </div>

    </div>


    <nav>

      <a href="dashboard.html">
        <span class="nav-icon">⌂</span>
        <span>Home</span>
      </a>


      <a href="equipment.html">
        <span class="nav-icon">▣</span>
        <span>Browse Equipment</span>
      </a>


      <a href="rentals.html">
        <span class="nav-icon">▢</span>
        <span>My Rentals</span>
      </a>


      <a href="payments.html">
        <span class="nav-icon">▤</span>
        <span>Payments</span>
      </a>


      <a
        class="active"
        href="notifications.html"
      >

        <span class="nav-icon">
          ♧
        </span>

        <span>
          Notifications
        </span>

        <span
          id="sidebarNotificationBadge"
          class="nav-badge"
        >
          0
        </span>

      </a>


      <a href="profile.html">

        <span class="nav-icon">
          ♙
        </span>

        <span>
          Profile
        </span>

      </a>

    </nav>


    <a
      class="back-site"
      href="index.html"
    >
      ‹ Back to main site
    </a>

  </aside>



  <!-- =========================
       MAIN CONTENT
  ========================== -->

  <main class="main">


    <!-- TOP BAR -->

    <header class="topbar">

      <div>

        <h1>
          Notifications
        </h1>

        <p>
          Student Portal · Puerto Princesa City
        </p>

      </div>


      <div class="top-actions">

        <label class="search-box">

          <span>
            ⌕
          </span>

          <input
            id="globalSearch"
            type="search"
            placeholder="Search equipment..."
          >

        </label>


        <button
          class="notification-button"
          id="notificationButton"
          title="Notifications"
        >

          ♧

          <span
            id="topNotificationBadge"
          >
            0
          </span>

        </button>


        <button
          class="profile-button"
          id="profileButton"
          title="Profile"
        >
          J
        </button>

      </div>

    </header>



    <!-- =========================
         NOTIFICATION CONTENT
    ========================== -->

    <section class="content">


      <!-- HEADER ROW -->

      <div class="notification-head">

        <div>

          <strong id="unread">
            0 unread notifications
          </strong>

        </div>


        <button
          id="readAll"
          class="read-all"
        >
          Mark all as read
        </button>

      </div>



      <!-- FILTERS -->

      <div
        id="notificationFilters"
        class="filters"
      >

        <button
          class="filter active"
          data-filter="All"
        >
          All
        </button>


        <button
          class="filter"
          data-filter="Approval"
        >
          Approval
        </button>


        <button
          class="filter"
          data-filter="Payment"
        >
          Payment
        </button>


        <button
          class="filter"
          data-filter="Pickup / Use"
        >
          Pickup / Use
        </button>


        <button
          class="filter"
          data-filter="Return"
        >
          Return
        </button>

      </div>



      <!-- NOTIFICATION LIST -->

      <div
        id="notificationList"
        class="notification-list"
      >

      </div>


    </section>

  </main>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script src="js/notifications.js"></script>
  <script src="js/student-session.js"></script>

</body>

</html>
