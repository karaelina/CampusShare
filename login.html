<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in - CampusShare</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-shell">
      <a class="back-link" href="index.html">‹ <span>Back</span></a>

      <div class="login-brand">
        <div class="brand-mark">CS</div>
        <div class="brand-name">CampusShare</div>
      </div>

      <div class="login-card">
        <h1>Log in</h1>
        <p class="login-subtitle">Enter your student credentials to continue.</p>

        <div id="formMessage" class="form-message"></div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label for="identifier">Student ID or Email</label>
            <input
              id="identifier"
              name="identifier"
              type="text"
              placeholder="2024-00123"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <div class="password-row">
            <span></span>
            <a class="forgot-link" href="#" id="forgotPassword">Forgot password?</a>
          </div>

          <button class="btn btn-dark login-submit" type="submit">Log In</button>
        </form>

        <div class="login-divider"><span>Don't have an account?</span></div>

        <button class="btn create-account" id="createAccountBtn">
          Create a Student Account
        </button>
      </div>

      <p class="terms">
        By logging in you agree to CampusShare's
        <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
      </p>
    </section>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
